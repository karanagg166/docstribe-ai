services:
  - type: web
    name: docstribe-backend
    env: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://docstribe-frontend.vercel.app
      - key: COHERE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
