services:
  - type: web
    name: docstribe-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://docstribe-frontend.vercel.app # Placeholder for the actual Vercel URL
      - key: COHERE_API_KEY
        sync: false # Set securely in Render dashboard
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard
