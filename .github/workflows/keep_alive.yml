name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute inactivity sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          # Replace this URL with your actual Render backend URL once deployed
          curl -sSf https://docstribe-backend.onrender.com/api/health > /dev/null
          echo "Pinged successfully"
